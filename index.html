<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>줄자로 배우는 소수 | 4학년</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* =========================================================
   줄자로 배우는 소수 — 디자인 토큰
   모눈종이 배경 + 줄자(노랑) 탭 + 수 모형 4색
   ========================================================= */
:root{
  --paper:#F7FAFF; --grid:#DFE8F6; --ink:#1F2A55; --soft:#5A6590; --line:#C9D4EA;
  --tape:#FFCB3D; --tape2:#E7AE00; --tapebg:#FFF4CC;
  --one:#3D6BF2; --tenth:#1FA06C; --hund:#FF8A1F; --thou:#E2457A;
  --ok:#11845A; --okbg:#E3F6EC; --bad:#C9303D; --badbg:#FDECEE;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink); font-size:17px; line-height:1.7;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
h1,h2,h3,button,.num,.big,.tab,.readout,.pv td,.vert td,.cmpq,.score{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
h2{font-size:1.5rem;margin:0 0 4px;line-height:1.3}
h3{font-size:1.2rem;margin:0 0 8px;line-height:1.35}
p{margin:0 0 10px}
b,strong{font-weight:700}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--one);outline-offset:2px}

/* ---------- 머리말 ---------- */
header.top{max-width:1000px;margin:0 auto;padding:16px 18px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:1.75rem;line-height:1.1}
.brand small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:.9rem;color:var(--soft)}
.brand .logo{width:46px;height:46px;flex:none}
.who{display:flex;align-items:center;gap:6px;font-size:.95rem;color:var(--soft)}
.who b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--one);text-decoration:underline;font:inherit;padding:4px 6px}

/* ---------- 줄자 탭 ---------- */
nav.tape{position:sticky;top:0;z-index:20;background:var(--tape);border-block:2px solid var(--tape2)}
nav.tape .inner{max-width:1000px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
nav.tape .inner::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-width:118px;text-align:left;border:0;border-right:1px dashed rgba(31,42,85,.35);
  padding:15px 14px 10px;font-size:1rem;color:var(--ink);background-color:transparent;line-height:1.25;
  background-image:repeating-linear-gradient(90deg,rgba(31,42,85,.6) 0 1px,transparent 1px 9px),
                   repeating-linear-gradient(90deg,rgba(31,42,85,.8) 0 2px,transparent 2px 45px);
  background-size:100% 6px,100% 10px;background-repeat:no-repeat;
}
.tab .n{display:block;font-family:'Gowun Dodum',sans-serif;font-size:.78rem;opacity:.75}
.tab[aria-selected="true"]{background-color:var(--ink);color:#fff;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 1px,transparent 1px 9px),
                   repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 2px,transparent 2px 45px)}
.tab .badge{display:inline-block;margin-left:4px;font-size:.75rem;background:#fff;color:var(--ok);border-radius:8px;padding:0 6px}
.tab.wrongtab .cnt{display:inline-block;margin-left:4px;font-size:.75rem;background:var(--bad);color:#fff;border-radius:8px;padding:0 6px}

main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
.panel[hidden]{display:none}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-head p{color:var(--soft);margin:0}
.seg{display:inline-flex;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:999px;font-size:1.02rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- 카드 ---------- */
.card{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:18px 20px;margin:0 0 16px;box-shadow:4px 4px 0 var(--line)}
.card.key{background:var(--tapebg);border-style:dashed;box-shadow:none}
.card.key ul{margin:0;padding-left:1.2em}
.muted{color:var(--soft);font-size:.92rem}
.num{font-size:1.15em}
.big{font-size:2rem;line-height:1.2}
.readout{font-size:1.45rem;line-height:1.35;margin:8px 0;min-height:1.4em}
.hi{color:var(--one)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-family:'Jua',sans-serif;font-size:.85em;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ctrl{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.ctrl label{min-width:5.5em}
.ctrl input[type=range]{flex:1;min-width:160px;accent-color:var(--one);height:28px}
.ctrl output{font-family:'Jua',sans-serif;min-width:4.5em;font-size:1.1rem}
input[type=text],input[type=number]{font:inherit;font-family:'Jua',sans-serif;font-size:1.3rem;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;width:9em;background:#fff;color:var(--ink)}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:9px 18px;font-size:1.05rem;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.yellow{background:var(--tape)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.scroll{overflow-x:auto;max-width:100%}
.tape-svg{width:100%;max-width:640px;height:auto;display:block}

/* ---------- 수 모형 ---------- */
.blocks{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;margin:8px 0}
.bgroup{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.bitems{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;max-width:520px}
.bg-hund .bitems,.bg-thou .bitems{max-width:150px}
.blabel{font-size:.9rem;color:var(--soft)}
.bempty{color:var(--soft);font-size:.95rem;padding:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--soft);background:#F4F7FD;border-radius:10px;padding:6px 10px;margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.blk{display:block}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.op{font-family:'Jua',sans-serif;font-size:1.8rem}

/* 자릿값 표 */
table.pv{border-collapse:collapse;margin:8px 0;min-width:280px}
.pv th{font-size:.82rem;font-weight:400;color:var(--soft);padding:4px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
.pv td{text-align:center;font-size:1.35rem;padding:4px 8px;border-bottom:1px solid var(--line)}
.pv td.pt{width:10px;padding:0}
.pv td.small{font-size:1rem;color:var(--soft)}
.pv .hl{background:#FFE9A8}
.pv .ghost{color:#B9C3DB}
.pv .c0{color:var(--one)} .pv .c1{color:var(--tenth)} .pv .c2{color:var(--hund)} .pv .c3{color:var(--thou)}

/* 100칸 모눈 */
.grid100{display:grid;grid-template-columns:repeat(10,1fr);width:min(320px,100%);aspect-ratio:1;border:2px solid var(--ink);touch-action:none;user-select:none}
.grid100 span{border:1px solid #C8D3EA;background:#fff}
.grid100 span.on{background:var(--hund);border-color:#D86E0C}
.grid100.static{width:150px;pointer-events:none}
.grid100.static span.on{background:var(--one);border-color:#2A4FC0}

/* 세로셈 */
table.vert{border-collapse:collapse;margin:8px 0;font-size:1.7rem}
.vert td{width:1.25em;height:1.45em;text-align:center;padding:0}
.vert td.pt{width:.45em}
.vert tr.mark td{font-size:.95rem;color:var(--bad);height:1.1em;vertical-align:bottom}
.vert tr.res td{border-top:3px solid var(--ink);color:var(--one)}
.vert td.hl{background:#FFE9A8}
ol.steps{margin:6px 0;padding-left:1.4em}
ol.steps li{margin:3px 0}
ol.steps li.now{font-weight:700}

/* 비교 */
.cmpq{display:flex;align-items:center;justify-content:center;gap:18px;font-size:2rem;margin:10px 0;flex-wrap:wrap}
.cmpq .circ{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border:3px solid var(--ink);border-radius:50%;font-size:1.2rem}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;font-family:'Jua',sans-serif;font-size:1.4rem}
.chain .box{border:2px solid var(--ink);border-radius:10px;padding:4px 12px;background:#fff}
.chain .arw{display:flex;flex-direction:column;align-items:center;font-size:.8rem;color:var(--soft);line-height:1.2}

/* ---------- 문제 풀기 ---------- */
.quiz{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:20px 22px;box-shadow:6px 6px 0 var(--ink)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qtag{font-size:.85rem;background:var(--tapebg);border:1px solid var(--tape2);border-radius:8px;padding:1px 8px}
.qtag.retry{background:#EDE7FF;border-color:#8B74E8}
.progress{flex:1;min-width:140px;height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;
  background-image:repeating-linear-gradient(90deg,transparent 0 9%,rgba(31,42,85,.35) 9% 10%)}
.progress i{display:block;height:100%;background:var(--tape)}
.qprompt{font-size:1.25rem;margin:6px 0 10px;line-height:1.5}
.qprompt .num,.qprompt b{font-family:'Jua',sans-serif;font-weight:400;font-size:1.15em}
.answer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.answer .unit{font-family:'Jua',sans-serif;font-size:1.3rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.choices button{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:12px;font-size:1.2rem;color:var(--ink);min-height:54px}
.choices button.sel-ok{background:var(--okbg);border-color:var(--ok)}
.choices button.sel-bad{background:var(--badbg);border-color:var(--bad)}
.builder{display:grid;gap:8px;margin:10px 0}
.brow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brow .bname{min-width:11em;display:flex;align-items:center;gap:8px}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:#fff;width:44px;height:42px;font-size:1.4rem;color:var(--ink)}
.stepper output{min-width:2.4em;text-align:center;font-family:'Jua',sans-serif;font-size:1.3rem;border-inline:2px solid var(--ink);line-height:42px}
.bview{min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin-top:6px}
.fb{margin-top:14px;border-radius:14px;padding:12px 16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb h4{margin:0 0 6px;font-family:'Jua',sans-serif;font-weight:400;font-size:1.3rem}
.fb.ok h4{color:var(--ok)} .fb.bad h4{color:var(--bad)}
.explain{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px}
.warn{color:var(--bad);font-size:.95rem;min-height:1.4em;margin-top:6px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.study{background:#F4F0FF;border:2px solid #8B74E8;border-radius:14px;padding:12px 16px;margin-bottom:12px}
.study h4{margin:0 0 6px;font-family:'Jua',sans-serif;font-weight:400;font-size:1.2rem;color:#5B45C2}
.score{font-size:3rem;line-height:1.1}
.stars{font-size:1.8rem;color:var(--tape2);letter-spacing:4px}
.send{font-size:.92rem;border-radius:10px;padding:8px 12px;margin-top:10px;background:#F4F7FD}
.wlist{display:grid;gap:12px}
.witem{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 16px}
.witem.done{opacity:.6;border-style:dashed}
.witem .meta{font-size:.85rem;color:var(--soft)}
.witem details summary{cursor:pointer;color:var(--one)}
.pill{display:inline-block;font-size:.8rem;border-radius:8px;padding:0 8px;margin-left:6px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}

/* ---------- 학생 정보 ---------- */
.overlay{position:fixed;inset:0;background:rgba(31,42,85,.55);display:grid;place-items:center;z-index:50;padding:16px}
.overlay[hidden]{display:none}
.login{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:8px 8px 0 var(--tape)}
.login .ctrl input{width:100%}
.login .ctrl label{min-width:3em}

@media (max-width:600px){
  body{font-size:16px}
  .card{padding:14px}
  .quiz{padding:16px}
  .brow .bname{min-width:100%}
  .big{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#FFCB3D" stroke="#1F2A55" stroke-width="3"/><circle cx="23" cy="23" r="6" fill="#fff" stroke="#1F2A55" stroke-width="3"/><path d="M23 44h21v-8H33" fill="#FFCB3D" stroke="#1F2A55" stroke-width="3"/></svg>
    <div><h1>줄자로 배우는 소수</h1><small>4학년 소수 단원 · cm, m, km로 소수 두 자리 수와 세 자리 수 익히기</small></div>
  </div>
  <div class="who" id="who"></div>
</header>

<nav class="tape" aria-label="소단원"><div class="inner" role="tablist" id="tabs"></div></nav>

<main id="main"></main>

<div class="overlay" id="loginBox" hidden>
  <form class="login" id="loginForm" onsubmit="return false">
    <h2>반갑습니다!</h2>
    <p class="muted">학습 결과를 선생님께 보내려면 내 정보를 적어 주세요.</p>
    <div class="ctrl"><label for="inCls">반</label><input type="number" id="inCls" min="1" max="20" inputmode="numeric" required></div>
    <div class="ctrl"><label for="inNum">번호</label><input type="number" id="inNum" min="1" max="40" inputmode="numeric" required></div>
    <div class="ctrl"><label for="inName">이름</label><input type="text" id="inName" maxlength="10" autocomplete="off" required></div>
    <div class="warn" id="loginWarn"></div>
    <div class="btns"><button class="btn primary" id="loginGo" type="button">학습 시작하기</button></div>
  </form>
</div>

<script>
/* =========================================================
   ★ 선생님 설정 ★
   구글 Apps Script를 '웹 앱'으로 배포한 뒤 받은 URL을 아래 따옴표 안에 붙여 넣으세요.
   비워 두면 결과는 학생 화면에만 보이고 전송되지 않습니다.
   ========================================================= */
const CONFIG = {
  SCRIPT_URL: "",
  QUESTIONS_PER_SET: 10,
  GRADE: 4
};

/* ================= 기본 도구 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };

/* 모든 소수는 '1000배 한 정수(milli)'로 다뤄 계산 오차를 없앱니다. 예) 2.37 → 2370 */
function fmt(m) {
  const ip = Math.floor(m / 1000), fp = m % 1000;
  return fp ? ip + '.' + String(fp).padStart(3, '0').replace(/0+$/, '') : String(ip);
}
function fmtFixed(m, d) {
  const ip = Math.floor(m / 1000), fp = String(m % 1000).padStart(3, '0');
  return d ? ip + '.' + fp.slice(0, d) : String(ip);
}
function decCount(m) { const f = m % 1000; if (!f) return 0; if (f % 100 === 0) return 1; if (f % 10 === 0) return 2; return 3; }
function parseMilli(s) {
  s = String(s).trim().replace(/\s/g, '').replace(/[,。．]/g, '.');
  if (!/^(\d+(\.\d*)?|\.\d+)$/.test(s)) return null;
  let [i, f = ''] = s.split('.');
  if (f.length > 3 && /[1-9]/.test(f.slice(3))) return -1;
  return parseInt(i || '0', 10) * 1000 + parseInt((f + '000').slice(0, 3), 10);
}
const KD = ['영', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
function readInt(n) {
  if (n === 0) return '영';
  const u = ['', '십', '백', '천'], ds = String(n).split('').map(Number); let s = '';
  ds.forEach((d, i) => { const un = u[ds.length - 1 - i]; if (!d) return; s += (d === 1 && un) ? un : KD[d] + un; });
  return s;
}
function readDec(str) { const [i, f] = String(str).split('.'); let r = readInt(parseInt(i, 10)); if (f) r += ' 점 ' + f.split('').map(d => KD[+d]).join(''); return r; }
function hasBat(w) {
  const ch = String(w).trim().slice(-1), c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
  if (/[0-9]/.test(ch)) return '013678'.includes(ch);
  return ch === 'g';
}
const J = (w, a, b) => w + (hasBat(w) ? a : b);
const YE = w => hasBat(w) ? '이에요' : '예요';
const frac = d => `<span class="fr" aria-label="${d}분의 1"><i>1</i><i>${d}</i></span>`;

/* ================= 저장소 ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem('decimal4:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('decimal4:' + k, JSON.stringify(v)); } catch (e) { } }
};
let student = store.get('student', null);
const sid = () => student ? `${student.cls}-${student.num}-${student.name}` : 'guest';
let wrongBook = [], best = {};
function loadStudentData() { wrongBook = store.get('wrong_' + sid(), []); best = store.get('best_' + sid(), {}); }
function saveWrong() { if (wrongBook.length > 80) wrongBook = wrongBook.slice(-80); store.set('wrong_' + sid(), wrongBook); refreshTabs(); }

/* ================= 수 모형 그리기 ================= */
const BC = {
  one: ['#3D6BF2', '#8EA8FF', '#2A4FC0'], tenth: ['#1FA06C', '#6FD3A6', '#147550'],
  hund: ['#FF8A1F', '#FFC08A', '#C9650C'], thou: ['#E2457A', '#F39BB9', '#A92A57']
};
const BLOCKS = {
  2: [{ k: 'one', v: 1000, s: '1', name: '큰 모눈 = 1', w: 10, h: 10, d: 0 },
      { k: 'tenth', v: 100, s: '0.1', name: '막대 = 0.1', w: 1, h: 10, d: 0 },
      { k: 'hund', v: 10, s: '0.01', name: '작은 칸 = 0.01', w: 1, h: 1, d: 0 }],

const ADD_CTX = [
  (A, B) => [`빨간 리본 ${A} m와 파란 리본 ${B} m가 있어요. 리본은 모두 몇 m인가요?`, 'm'],
  (A, B) => [`집에서 공원까지 ${A} km, 공원에서 도서관까지 ${B} km예요. 집에서 공원을 지나 도서관까지는 몇 km인가요?`, 'km'],
  (A, B) => [`<b>${A} + ${B}</b>${hasBat(B) ? '을' : '를'} 계산하세요.`, ''],
  (A, B) => [`<b>${A} + ${B}</b>${hasBat(B) ? '을' : '를'} 계산하세요.`, '']
];
const SUB_CTX = [
  (A, B) => [`리본 ${A} m 중에서 ${B} m를 사용했어요. 남은 리본은 몇 m인가요?`, 'm'],
  (A, B) => [`${A} km를 걸어야 하는데 ${B} km를 걸었어요. 남은 거리는 몇 km인가요?`, 'km'],
  (A, B) => [`<b>${A} − ${B}</b>${hasBat(B) ? '을' : '를'} 계산하세요.`, ''],
  (A, B) => [`<b>${A} − ${B}</b>${hasBat(B) ? '을' : '를'} 계산하세요.`, '']
];
function addQ(a, b) {
  const [p, unit] = pick(ADD_CTX)(fmt(a), fmt(b));
  return { kind: 'num', unit, prompt: p, answer: a + b,
    explain: `<p>소수점끼리 맞추어 세로로 쓰고, 같은 자리끼리 더해요. 자릿수가 다르면 빈 자리에 0이 있다고 생각해요.</p>` + vertHTML(a, b, '+') + `<ol class="steps">${vertData(a, b, '+').steps.map(s => `<li>${s}</li>`).join('')}</ol>` };
}
function subQ(a, b) {
  const [p, unit] = pick(SUB_CTX)(fmt(a), fmt(b));
  return { kind: 'num', unit, prompt: p, answer: a - b,
    explain: `<p>소수점끼리 맞추어 세로로 쓰고, 같은 자리끼리 빼요. 뺄 수 없으면 바로 윗자리에서 10을 받아내려요. 빨간 숫자는 받아내림한 뒤의 수예요.</p>` + vertHTML(a, b, '-') + `<ol class="steps">${vertData(a, b, '-').steps.map(s => `<li>${s}</li>`).join('')}</ol>` };
}
function addBlocksDemo(a, b) {
  const ca = countsOf(a, 2), cb = countsOf(b, 2), raw = ca.map((x, i) => x + cb[i]);
  let s = legendHTML(2) + `<div class="eq">${blocksHTML(ca, 2)}<span class="op">+</span>${blocksHTML(cb, 2)}</div><ol class="steps">`;
  s += `<li>같은 모형끼리 모으면 1이 ${raw[0]}개, 0.1이 ${raw[1]}개, 0.01이 ${raw[2]}개예요.</li>`;
  if (raw[2] >= 10) s += `<li>0.01이 10개면 0.1이 돼요. 작은 칸 10개를 막대 1개로 바꿔요.</li>`;
  if (raw[1] + (raw[2] >= 10 ? 1 : 0) >= 10) s += `<li>0.1이 10개면 1이 돼요. 막대 10개를 큰 모눈 1개로 바꿔요.</li>`;
  s += `<li>그래서 ${fmt(a)} + ${fmt(b)} = <b class="num">${fmt(a + b)}</b></li></ol>`;
  return s + blocksHTML(countsOf(a + b, 2), 2);
}
function subBlocksDemo(a, b) {
  const ca = countsOf(a, 2), cb = countsOf(b, 2);
  let s = legendHTML(2) + `<p>${fmt(a)}만큼 수 모형을 놓아요.</p>` + blocksHTML(ca, 2) + '<ol class="steps">';
  let cur = ca.slice();
  if (cur[2] < cb[2]) {
    if (cur[1] === 0) { cur[0]--; cur[1] += 10; s += `<li>0.1 막대가 없어서 큰 모눈 1개를 0.1 막대 10개로 바꿔요.</li>`; }
    cur[1]--; cur[2] += 10;
    s += `<li>0.01이 ${ca[2]}개뿐이라 ${cb[2]}개를 덜어낼 수 없어요. 0.1 막대 1개를 0.01 작은 칸 10개로 바꿔요.</li></ol>` + blocksHTML(cur, 2) + '<ol class="steps" start="2">';
  }
  if (cur[1] < cb[1]) { cur[0]--; cur[1] += 10; s += `<li>0.1 막대가 모자라서 큰 모눈 1개를 막대 10개로 바꿔요.</li>`; }
  s += `<li>0.01 작은 칸 ${cb[2]}개, 0.1 막대 ${cb[1]}개${cb[0] ? `, 큰 모눈 ${cb[0]}개` : ''}를 덜어내요.</li>`;
  s += `<li>남은 모형은 <b class="num">${fmt(a - b)}</b>${YE(fmt(a - b))}. 그래서 ${fmt(a)} − ${fmt(b)} = ${fmt(a - b)}</li></ol>`;
  return s + blocksHTML(countsOf(a - b, 2), 2);
}

    else { do { a = ri(121, 199) * 10; b = ri(11, 89) * 10; } while (!((a % 100) < (b % 100) && Math.floor(a % 1000 / 100) - 1 >= Math.floor(b / 100))); K('cbDemo').innerHTML = subBlocksDemo(a, b); }
  };
  K('cbNew').onclick = demo; demo();
  let step = 0, A = 0, B = 0, data = null;

    if (a == null || b == null || a < 0 || b < 0 || a >= 1000000 || b >= 1000000) { K('vWarn').textContent = '소수 셋째 자리까지의 수를 넣어 주세요.'; data = null; return false; }

    K('vWarn').textContent = ''; A = a; B = b; data = vertData(a, b, op); step = 0; return true;
  };

    K('vSteps').innerHTML = items.slice(0, step + 1).map((s, i) => `<li class="${i === step ? 'now' : ''}">${s}</li>`).join('');
    K('vNext').disabled = step >= data.len + 1;
  };
  K('vA').oninput = K('vB').oninput = () => { load(); show(); };
  K('vReset').onclick = () => { load(); show(); };
  K('vNext').onclick = () => { if (!data) return; step = Math.min(step + 1, data.len + 1); show(); };
  load(); show();
}
function paintGrid(grid, onChange, clr) {
  let html = ''; for (let i = 0; i < 100; i++) html += `<span data-i="${i}"></span>`; grid.innerHTML = html;
  let painting = null;
  const count = () => onChange($$('span.on', grid).length);
  const apply = t => { if (t && t.dataset && t.dataset.i != null && grid.contains(t)) { t.classList.toggle('on', painting); } };
  grid.addEventListener('pointerdown', e => { const t = e.target; if (t.dataset.i == null) return; painting = !t.classList.contains('on'); apply(t); count(); e.preventDefault(); });
  grid.addEventListener('pointermove', e => { if (painting == null) return; apply(document.elementFromPoint(e.clientX, e.clientY)); count(); });
  window.addEventListener('pointerup', () => painting = null);
  clr.onclick = () => { $$('span', grid).forEach(s => s.classList.remove('on')); count(); };
  count();
}

const quizzes = {};

function makeQ(tab, gen) { const q = G[tab][gen](); q.tab = tab; q.gen = gen; q.unit = q.unit || ''; q.answerText = q.kind === 'num' || q.kind === 'build' ? fmt(q.answer) : String(q.answer); return q; }
function makeSet(tab) {
  const gens = Object.keys(G[tab]); let order = [];
  while (order.length < CONFIG.QUESTIONS_PER_SET) order = order.concat(shuffle(gens));
  return order.slice(0, CONFIG.QUESTIONS_PER_SET).map(g => makeQ(tab, g));
}
function startQuiz(key) {

}

function bindAnswer(key, el, q) {
  const warn = m => { const w = $('[data-warn]', el); w.textContent = m; w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); };
  if (q.kind === 'choice') {
    $$('[data-c]', el).forEach(b => b.onclick = () => { if ($('[data-fb]', el).classList.contains('show')) return; submit(key, el, q, b.dataset.c, b.dataset.c === q.answer, b); });
    return;
  }
  if (q.kind === 'build') {
    $$('[data-d]', el).forEach(b => b.onclick = () => {
      if ($('[data-fb]', el).classList.contains('show')) return;
      const i = +b.dataset.i; q.build[i] = Math.max(0, Math.min(9, q.build[i] + +b.dataset.d));
      $(`[data-o="${i}"]`, el).textContent = q.build[i]; $('[data-view]', el).innerHTML = blocksHTML(q.build, q.mode, { noLabel: true });
    });
    $('[data-check]', el).onclick = () => {
      if (q.build.every(c => !c)) return warn('수 모형을 먼저 놓아 주세요.');
      const v = q.build.reduce((s, c, i) => s + c * BLOCKS[q.mode][i].v, 0);
      submit(key, el, q, `${fmt(v)} (모형으로 놓은 수)`, v === q.answer);
    };
    return;
  }
  const inp = $('[data-in]', el);
  const go = () => {
    if ($('[data-fb]', el).classList.contains('show')) return;
    const s = inp.value.trim(); if (!s) return warn('답을 입력해 주세요.');
    if (q.kind === 'int') { if (!/^\d+$/.test(s.replace(/,/g, ''))) return warn('자연수로 입력해 주세요. 예) 245'); return submit(key, el, q, s, +s.replace(/,/g, '') === q.answer); }
    const v = parseMilli(s); if (v == null) return warn('소수를 바르게 입력해 주세요. 예) 0.25');
    submit(key, el, q, s, v === q.answer);
  };
  $('[data-check]', el).onclick = go;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function submit(key, el, q, given, ok, btn) {
  const z = quizzes[key], it = z.items[z.idx]; it.given = given; it.ok = ok;
  $$('button[data-c],button[data-d],button[data-check]', el).forEach(b => b.disabled = true);
  const inp = $('[data-in]', el); if (inp) inp.readOnly = true;
  if (btn) btn.classList.add(ok ? 'sel-ok' : 'sel-bad');
  if (!ok && q.kind === 'choice') { const r = $$('[data-c]', el).find(b => b.dataset.c === q.answer); if (r) r.classList.add('sel-ok'); }
  const fb = $('[data-fb]', el);
  const last = z.idx === z.items.length - 1;
  const nextLabel = last ? '결과 보기' : '다음 문제';
  if (ok) {
    fb.className = 'fb ok show';
    fb.innerHTML = `<h4>${pick(PRAISE)}</h4>${z.mode === 'retry' ? '<p>이제 이 문제는 해결했어요.</p>' : ''}<div class="btns"><button class="btn primary" type="button" data-next>${nextLabel}</button></div>`;
    if (z.mode === 'retry') { it.orig.resolved = true; it.orig.resolvedAt = Date.now(); saveWrong(); }
  } else {
    fb.className = 'fb bad show';
    fb.innerHTML = `<h4>아쉬워요. 정답은 ${esc(q.answerText)}${q.unit ? ' ' + q.unit : ''}</h4><p>내가 쓴 답: ${esc(given)}</p>
      <div class="explain"><b>풀이로 다시 배워요</b>${q.explain}</div>
      <p class="muted">${z.mode === 'retry' ? '이 문제는 오답 노트에 남겨 둘게요. 한 번 더 도전해 봐요!' : '이 문제는 오답 노트에 저장돼요. 다 풀고 나면 비슷한 문제로 다시 확인해요.'}</p>
      <div class="btns"><button class="btn primary" type="button" data-next>${nextLabel}</button>${q.tab && CONCEPT[q.tab] ? `<button class="btn" type="button" data-concept>개념 익히기 다시 보기</button>` : ''}</div>`;
    if (z.mode === 'first') {
      wrongBook.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), tab: q.tab, gen: q.gen, prompt: q.prompt, visual: q.visual || '', given, answerText: q.answerText + (q.unit ? ' ' + q.unit : ''), explain: q.explain, resolved: false, at: Date.now() });
      it.wrongRef = wrongBook[wrongBook.length - 1]; saveWrong();
    } else { it.orig.tries = (it.orig.tries || 0) + 1; saveWrong(); }
    const c = $('[data-concept]', fb); if (c) c.onclick = () => { openTab(q.tab); setView(q.tab, 'concept'); window.scrollTo({ top: 0 }); };
  }
  $('[data-next]', fb).onclick = () => { z.idx++; z.stage = z.mode === 'retry' ? 'study' : 'answer'; renderQuiz(key); practiceEl(key).scrollIntoView({ block: 'start' }); };
  $('[data-next]', fb).focus({ preventScroll: true });
}

function renderSummary(key) {
  const z = quizzes[key], el = practiceEl(key), total = z.items.length, correct = z.items.filter(i => i.ok).length;
  const score = Math.round(correct / total * 100), secs = Math.round((Date.now() - z.start) / 1000);
  const unitName = key === 'wrong' ? '오답 노트(여러 단원)' : tabById(key).name;
  const wrongItems = z.items.filter(i => !i.ok);
  const wrongTxt = wrongItems.map(i => strip(i.q.prompt).slice(0, 40) + ` [정답 ${i.q.answerText}${i.q.unit ? i.q.unit : ''} / 학생 ${i.given}]`).join(' / ');
  if (z.mode === 'first') { if (best[key] == null || score > best[key]) { best[key] = score; store.set('best_' + sid(), best); } }
  if (!z.sent) { z.sent = true; sendResult({ unit: unitName, kind: z.mode === 'first' ? '첫 도전' : '오답 재도전', correct, total, score, wrongList: wrongTxt || '없음', seconds: secs }); }
  const stars = score >= 90 ? '★★★' : score >= 70 ? '★★☆' : '★☆☆';
  const firstWrong = z.mode === 'first' ? z.items.filter(i => !i.ok && i.wrongRef).map(i => i.wrongRef) : [];
  const stillWrong = z.mode === 'retry' ? z.items.filter(i => !i.ok).map(i => i.orig) : [];
  el.innerHTML = `<div class="quiz">
    <h3>${z.mode === 'first' ? '문제 풀기 결과' : '오답 다시 학습 결과'}</h3>
    <div class="row"><span class="score">${correct} / ${total}</span><span class="stars" aria-label="별 ${stars.split('★').length - 1}개">${stars}</span></div>
    <p>${z.mode === 'first' ? (correct === total ? '모두 맞혔어요! 소수 박사예요.' : `틀린 문제 ${total - correct}개를 다시 공부하고 비슷한 문제로 확인해 봐요.`) : (correct === total ? '틀렸던 문제를 모두 해결했어요!' : `${total - correct}개는 아직 연습이 더 필요해요. 풀이를 한 번 더 읽고 도전해 봐요.`)}</p>
    <div class="btns">
      ${firstWrong.length ? `<button class="btn yellow" type="button" data-rw>틀린 문제 다시 학습하기</button>` : ''}
      ${stillWrong.length ? `<button class="btn yellow" type="button" data-rw2>남은 오답 한 번 더 학습하기</button>` : ''}
      ${key !== 'wrong' ? `<button class="btn" type="button" data-again>새 문제로 다시 풀기</button>` : `<button class="btn" type="button" data-home>오답 노트로 돌아가기</button>`}
    </div><div class="send" data-send>${sendStatusText()}</div></div>`;
  const a = $('[data-rw]', el); if (a) a.onclick = () => startRetry(key, firstWrong);
  const b = $('[data-rw2]', el); if (b) b.onclick = () => startRetry(key, stillWrong);
  const c = $('[data-again]', el); if (c) c.onclick = () => startQuiz(key);
  const d = $('[data-home]', el); if (d) d.onclick = () => renderWrongNote();
  refreshTabs();
}

/* ================= 결과 전송 (구글 시트) ================= */
let lastSend = 'idle';
function sendStatusText() {
  if (!CONFIG.SCRIPT_URL) return '결과 전송이 아직 설정되지 않았어요. 이 화면을 선생님께 보여 주세요.';
  if (lastSend === 'sent') return '✓ 선생님께 결과를 보냈어요.';
  if (lastSend === 'fail') return '인터넷 연결이 불안정해서 아직 보내지 못했어요. 연결되면 자동으로 다시 보내요.';
  return '선생님께 결과를 보내는 중이에요…';
}
function sendResult(r) {
  const rec = Object.assign({ grade: CONFIG.GRADE, cls: student.cls, num: student.num, name: student.name, clientTime: new Date().toLocaleString('ko-KR') }, r);
  const box = store.get('outbox', []); box.push(rec); store.set('outbox', box.slice(-50));
  flushOutbox();
}
let flushing = false;
async function flushOutbox() {
  if (!CONFIG.SCRIPT_URL || flushing) return; flushing = true;
  let box = store.get('outbox', []);
  while (box.length) {
    try {
      await fetch(CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(box[0]) });
      box.shift(); store.set('outbox', box); lastSend = 'sent';
    } catch (e) { lastSend = 'fail'; break; }
  }
  flushing = false;
  $$('[data-send]').forEach(s => s.textContent = sendStatusText());
}
window.addEventListener('online', flushOutbox);

/* ================= 오답 노트 ================= */
function renderWrongNote() {
  const el = practiceEl('wrong'), open = wrongBook.filter(w => !w.resolved), done = wrongBook.filter(w => w.resolved);
  const item = w => `<div class="witem${w.resolved ? ' done' : ''}"><div class="meta">${esc(tabById(w.tab).name)} · ${new Date(w.at).toLocaleDateString('ko-KR')}${w.resolved ? '<span class="pill ok">해결</span>' : `<span class="pill bad">다시 학습 필요${w.tries ? ` · ${w.tries}번 더 틀림` : ''}</span>`}</div>
    <div class="qprompt">${w.prompt}</div>${w.visual ? `<details><summary>그림 보기</summary>${w.visual}</details>` : ''}
    <p>내가 쓴 답: <b>${esc(w.given)}</b> / 정답: <b>${esc(w.answerText)}</b></p>
    <details><summary>풀이 보기</summary><div class="explain">${w.explain}</div></details></div>`;
  el.innerHTML = `<div class="panel-head"><div><h2>오답 노트</h2><p>틀린 문제가 모두 모여 있어요. 풀이를 공부하고 비슷한 문제로 확인하면 '해결'이 돼요.</p></div></div>
    ${open.length ? `<div class="btns" style="margin-bottom:14px"><button class="btn primary" type="button" data-all>남은 오답 ${open.length}개 다시 학습하기</button></div>` : '<div class="card"><p>다시 학습할 문제가 없어요. 각 소단원에서 문제를 풀어 보세요!</p></div>'}
    <div class="wlist">${open.map(item).join('')}</div>
    ${done.length ? `<h3 style="margin-top:22px">해결한 문제 ${done.length}개</h3><div class="btns" style="margin-bottom:10px"><button class="btn" type="button" data-clear>해결한 문제 지우기</button></div><div class="wlist">${done.slice().reverse().map(item).join('')}</div>` : ''}`;
  const a = $('[data-all]', el); if (a) a.onclick = () => startRetry('wrong', open);
  const c = $('[data-clear]', el); if (c) c.onclick = () => { wrongBook = wrongBook.filter(w => !w.resolved); saveWrong(); renderWrongNote(); };
}

/* ================= 화면 구성 ================= */
let currentTab = 'd2';
const views = {};
function buildUI() {
  $('#tabs').innerHTML = TABS.map((t, i) => `<button class="tab" role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}" data-tab="${t.id}"><span class="n">${i + 1}. ${t.sub}</span>${t.name}<span class="badge" data-badge></span></button>`).join('')
    + `<button class="tab wrongtab" role="tab" id="tab-wrong" aria-controls="panel-wrong" data-tab="wrong"><span class="n">틀린 문제 모음</span>오답 노트<span class="cnt" data-cnt></span></button>`;
  $('#main').innerHTML = TABS.map(t => `<section class="panel" id="panel-${t.id}" role="tabpanel" aria-labelledby="tab-${t.id}" hidden>
      <div class="panel-head"><div><h2>${t.name}</h2><p>${t.sub}</p></div>
      <div class="seg" role="group" aria-label="학습 방법"><button type="button" data-view="concept" aria-pressed="true">개념 익히기</button><button type="button" data-view="practice" aria-pressed="false">문제 풀기</button></div></div>
      <div id="concept-${t.id}"></div><div id="practice-${t.id}" hidden></div></section>`).join('')
    + `<section class="panel" id="panel-wrong" role="tabpanel" aria-labelledby="tab-wrong" hidden><div id="practice-wrong"></div></section>`;
  $$('.tab').forEach(b => b.onclick = () => openTab(b.dataset.tab));
  TABS.forEach(t => {
    CONCEPT[t.id]($(`#concept-${t.id}`)); renderPracticeHome(t.id); views[t.id] = 'concept';
    $$(`#panel-${t.id} [data-view]`).forEach(b => b.onclick = () => setView(t.id, b.dataset.view));
  });
}
function setView(id, v) {
  views[id] = v;
  $$(`#panel-${id} [data-view]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  $(`#concept-${id}`).hidden = v !== 'concept'; $(`#practice-${id}`).hidden = v !== 'practice';
  if (v === 'practice' && !quizzes[id]) renderPracticeHome(id);
}
function openTab(id) {
  currentTab = id;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  $$('.panel').forEach(p => p.hidden = p.id !== 'panel-' + id);
  if (id === 'wrong' && !(quizzes.wrong && quizzes.wrong.idx < quizzes.wrong.items.length)) renderWrongNote();
  const tb = $('#tab-' + id); if (tb) tb.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function refreshTabs() {
  TABS.forEach(t => { const b = $(`#tab-${t.id} [data-badge]`); if (b) b.textContent = best[t.id] != null ? best[t.id] + '점' : ''; if (b) b.style.display = best[t.id] != null ? '' : 'none'; });
  const n = wrongBook.filter(w => !w.resolved).length, c = $('[data-cnt]'); if (c) { c.textContent = n; c.style.display = n ? '' : 'none'; }
}
function renderWho() {
  $('#who').innerHTML = student ? `<span>${CONFIG.GRADE}학년 <b>${esc(student.cls)}반 ${esc(student.num)}번 ${esc(student.name)}</b></span><button class="linkbtn" id="chg" type="button">학생 바꾸기</button>` : '';
  const c = $('#chg'); if (c) c.onclick = showLogin;
}
function showLogin() {
  $('#loginBox').hidden = false;
  if (student) { $('#inCls').value = student.cls; $('#inNum').value = student.num; $('#inName').value = student.name; }
  $('#inCls').focus();
}
$('#loginGo').onclick = () => {
  const cls = $('#inCls').value.trim(), num = $('#inNum').value.trim(), name = $('#inName').value.trim();
  if (!cls || !num || !name) { $('#loginWarn').textContent = '반, 번호, 이름을 모두 적어 주세요.'; return; }
  student = { cls, num, name }; store.set('student', student);
  $('#loginBox').hidden = true; $('#loginWarn').textContent = '';
  loadStudentData(); renderWho(); refreshTabs();
  Object.keys(quizzes).forEach(k => delete quizzes[k]); TABS.forEach(t => renderPracticeHome(t.id)); if (currentTab === 'wrong') renderWrongNote();
};
$('#loginForm').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginGo').click(); });

loadStudentData();
buildUI();
openTab('d2');
renderWho();
refreshTabs();
if (!student) showLogin(); else flushOutbox();
</script>
</body>
</html>
